name: Daily pin release

# Every morning, add the pins dated today to the Pinterest RSS feeds.
on:
  schedule:
    - cron: "17 11 * * *"   # 5:17 AM Chicago time in winter, 6:17 AM in summer
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild feeds
        run: python3 scripts/build_feeds.py

      - name: Commit if anything changed
        id: commit
        run: |
          if git diff --quiet -- feeds; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new pins today."
          else
            git config user.name "fridgepaper-bot"
            git config user.email "fridgepaper-bot@users.noreply.github.com"
            git add feeds
            git commit -m "Daily pin release $(TZ=America/Chicago date +%F)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages will publish on its own."
